name: Deploy Echo11 to GitHub Pages

on:
  push:
    branches: ["main"] # Change to "master" if your repository's default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm install

      - name: Build Vite Production Site
        run: npm run build

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload Finished Production Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite drops the compiled web build inside the dist/ folder

      - name: Deploy Live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
